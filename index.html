<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow State</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <nav class="tabs">
      <button id="tab-home" type="button" class="tab-btn tab-btn-active">Home</button>
      <button id="tab-settings" type="button" class="tab-btn">Settings</button>
    </nav>

    <main class="container" id="home-view">
      <div class="brand">
        <img src="/src/assets/logo.svg" alt="Flow State" />
        <h1>Flow State</h1>
      </div>

      <div class="hero" id="hero">
        <p class="hero-label" id="hero-label">No reminders armed</p>
        <p class="hero-countdown" id="hero-countdown"></p>
      </div>
      <div class="reminder-chips" id="reminder-chips"></div>

      <div class="card interval-card">
        <label class="interval-slider-label" for="hydration-interval-slider">Start timer</label>
        <div class="row">
          <input id="hydration-interval-slider" type="range" min="5" max="240" step="5" value="120" />
          <span id="hydration-interval-value" class="interval-slider-value">120 min</span>
          <button id="pause-toggle" type="button" class="pause-btn">Pause</button>
        </div>
      </div>

      <div class="card water-card">
        <div class="water-card-row">
          <div class="ring-container" id="water-ring"></div>
          <div class="water-stats">
            <div class="bars-container" id="water-bars"></div>
            <p class="water-streak" id="water-streak">Streak 0 days</p>
          </div>
        </div>
        <div id="home-water-entry"></div>
        <p class="water-range-stat" id="water-month-stats"></p>
        <p class="water-range-stat" id="water-year-stats"></p>
      </div>

      <div class="row debug-row">
        <button id="test-alert" type="button" class="ghost-btn">Test alert in 10s</button>
        <button
          id="test-notification"
          type="button"
          class="ghost-btn"
          title="Windows toasts only fire from an installed build — this is a silent no-op under `tauri dev`."
        >
          Test notification
        </button>
      </div>
    </main>

    <section class="settings-view" id="settings-view" hidden>
      <h2 class="settings-title">Settings</h2>

      <details class="settings-section" open>
        <summary>Reminders</summary>
        <div id="settings-reminders-container"></div>
      </details>

      <details class="settings-section">
        <summary>Water</summary>
        <div class="settings-card-body">
          <label class="settings-field">
            Bottle size (oz)
            <input id="settings-bottle-oz" type="number" min="1" />
          </label>
          <label class="settings-field">
            Daily goal (oz)
            <input id="settings-daily-goal-oz" type="number" min="1" />
          </label>
          <p class="settings-field" id="settings-today-logged">Today logged: 0 oz</p>
          <div class="row">
            <input id="settings-remove-oz" type="number" min="1" placeholder="oz" class="water-entry-custom-input" />
            <button id="settings-remove-water" type="button">Remove</button>
          </div>
          <div class="row">
            <button id="settings-clear-today" type="button">Clear today</button>
          </div>
        </div>
      </details>

      <details class="settings-section">
        <summary>Alerts &amp; sound</summary>
        <div class="settings-card-body">
          <label class="settings-field">
            Snooze length (minutes)
            <input id="settings-snooze" type="number" min="1" />
          </label>
          <label class="settings-field">
            Max snoozes
            <input id="settings-max-snoozes" type="number" min="0" step="1" />
          </label>
          <label class="settings-field">
            Volume
            <input id="settings-volume" type="range" min="0" max="1" step="0.05" />
          </label>
          <div class="row">
            <button id="settings-test-sound" type="button">Test sound</button>
          </div>
        </div>
      </details>

      <details class="settings-section">
        <summary>System</summary>
        <div class="settings-card-body">
          <label class="settings-field settings-field-checkbox">
            <span id="settings-start-with-windows-switch"></span>
            Start with Windows
          </label>
        </div>
      </details>

      <p class="settings-error" id="settings-error" hidden></p>

      <div class="row">
        <button id="settings-save" type="button" class="takeover-confirm">Save</button>
      </div>
    </section>

    <div id="inactive-overlay" class="inactive-overlay" hidden>
      <p class="inactive-text">
        Paused<br />
        <span class="inactive-hint">move or type to resume</span>
      </p>
    </div>

    <div id="takeover-overlay" class="takeover-overlay" hidden>
      <div class="takeover-card">
        <img src="/src/assets/logo.svg" alt="" class="takeover-logo" />
        <h2 class="takeover-title" id="takeover-title">Time to hydrate</h2>
        <div id="takeover-water-entry" hidden></div>
        <div class="row" id="takeover-confirm-row">
          <button id="takeover-confirm" type="button" class="takeover-confirm">Done</button>
        </div>
        <div class="row">
          <button id="takeover-snooze" type="button" class="takeover-snooze">Snooze 15 min</button>
        </div>
        <p class="takeover-hint" id="takeover-snooze-hint" hidden></p>
      </div>
    </div>
  </body>
</html>
