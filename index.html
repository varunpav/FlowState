<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Flow State</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <main class="container">
      <div class="brand">
        <img src="/src/assets/logo.svg" alt="Flow State" />
        <h1>Flow State</h1>
      </div>
      <p id="countdown" class="countdown">--:--</p>

      <div class="row">
        <input id="interval-minutes" type="number" min="1" value="120" />
        <button id="start-interval" type="button">Set interval (min)</button>
      </div>

      <div class="row">
        <button id="fire-in-10s" type="button">Debug: fire in 10s</button>
      </div>
    </main>

    <div id="inactive-overlay" class="inactive-overlay" hidden>
      <p class="inactive-text">
        Inactive (<span id="inactive-seconds">0</span>s)<br />
        <span class="inactive-hint">move or type to resume</span>
      </p>
    </div>

    <div id="takeover-overlay" class="takeover-overlay" hidden>
      <div class="takeover-card">
        <img src="/src/assets/logo.svg" alt="" class="takeover-logo" />
        <h2 class="takeover-title">Time to hydrate</h2>
        <div class="row">
          <button id="takeover-confirm" type="button" class="takeover-confirm">I drank water</button>
          <button id="takeover-snooze" type="button" class="takeover-snooze">Snooze 5 min</button>
        </div>
        <p class="takeover-hint" id="takeover-snooze-hint" hidden></p>
      </div>
    </div>
  </body>
</html>
